name: Build bundle

on:
  # This is intentionally schedule-only plus manual: push workflows run from
  # the pushed branch, where this file is absent on backend/frontend/cli.
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - id: build
        name: Build and publish bundle
        run: node scripts/build-bundle.mjs --push

      - name: Dispatch Docker image release
        if: steps.build.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run docker.yml --ref main
